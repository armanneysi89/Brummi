name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_MINOR: "4.7"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;33.0.1 platforms;android-34"

      - name: Install Godot and export templates
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip -d "$HOME/godot"
          unzip -q templates.tpz -d "$HOME/tpl"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv "$HOME/tpl/templates" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Configure Android export
        run: |
          mkdir -p "$HOME/.local/share/godot/keystores" "$HOME/.config/godot"
          keytool -genkeypair -v -keyalg RSA -keysize 2048 -validity 9999 \
            -alias androiddebugkey -keypass android -storepass android \
            -keystore "$HOME/.local/share/godot/keystores/debug.keystore" \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_MINOR}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: '"$GODOT" --headless --path . --import || true'

      - name: Export all platforms
        run: bash tools/build_release.sh

      - name: Package
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          bash tools/package_release.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: brummi-release
          path: builds/release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: builds/release/*
          generate_release_notes: true
